<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grazie — Polyhedra</title>
<meta name="author" content="Sara Noggler — Polyhedra">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--black:#0d0d0d;--white:#ffffff;--off:#f8f7f4;--gold:#C8A96E;--gray:#6b6b6b;--mid:#e0ddd8}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--black);font-family:'Inter',sans-serif;font-size:17px;line-height:1.75}
header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--mid)}
nav{max-width:1200px;margin:0 auto;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.08em;color:var(--black);text-decoration:none}
.logo span{color:var(--gold)}
.back{font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray);text-decoration:none;transition:color 0.2s}
.back:hover{color:var(--gold)}
.wrap{max-width:720px;margin:0 auto;padding:120px 40px 80px}
.label{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.label::before{content:'';width:28px;height:1px;background:var(--gold)}
h1{font-family:'Syne',sans-serif;font-size:clamp(28px,4vw,44px);font-weight:700;line-height:1.1;letter-spacing:-0.02em;margin-bottom:20px}
.intro{font-size:18px;color:var(--gray);line-height:1.7;margin-bottom:32px;font-style:italic;border-left:3px solid var(--gold);padding-left:20px}
.meta{font-size:12px;color:var(--gray);margin-bottom:44px;padding-bottom:28px;border-bottom:1px solid var(--mid)}
.body p{margin-bottom:26px;color:#2a2a2a;font-weight:300}
.sign{margin-top:52px;padding-top:28px;border-top:1px solid var(--mid)}
.sign .name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--black)}
.sign .role{font-size:13px;color:var(--gold);margin-top:4px}
.sign .site{font-size:13px;color:var(--gray);margin-top:2px}
footer{background:var(--black);padding:44px 40px;margin-top:80px;text-align:center}
footer .fl{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.08em;color:var(--white);margin-bottom:10px}
footer .fl span{color:var(--gold)}
footer p{font-size:13px;color:#555;margin-bottom:12px}
footer a{color:var(--gold);text-decoration:none;font-size:13px}
@media(max-width:600px){nav{padding:0 20px}.wrap{padding:100px 20px 60px}}
</style>
</head>
<body>
<header><nav>
  <a href="index.html" class="logo">POLY<span>.</span>HEDRA</a>
  <a href="index.html" class="back">← Torna al sito</a>
</nav></header>
<main class="wrap">
  <p class="label">Richiesta ricevuta</p>
  <h1>Grazie, abbiamo ricevuto il tuo messaggio.</h1>
  <p class="intro">Ti rispondiamo entro due giorni lavorativi.</p>
  <div class="body"><p>Nel frattempo puoi leggere le nostre analisi o scoprire i progetti che abbiamo seguito.</p></div>
  <p style="margin-top:32px"><a href="index.html#casi" class="back" style="color:var(--gold)">← Torna al sito</a></p>
</main>
<footer>
  <div class="fl">POLY<span>.</span>HEDRA</div>
  <p>Boutique PR e contenuti strategici · Milano</p>
</footer>
</body>
</html>
